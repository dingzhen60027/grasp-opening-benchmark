name: Validate benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install runtime
        run: python -m pip install -r requirements-lock.txt
      - name: Verify source evidence
        run: bash tools/python.sh tools/check_evidence.py
      - name: Run tests
        run: bash tools/python.sh -m pytest -q tests
      - name: Recheck rack tasks and open-hand exits
        run: bash tools/python.sh -m rackbench.audit --data data/rack_v0.2 --output reports/ci_nominal_audit
